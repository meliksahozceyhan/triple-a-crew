<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Board</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f1e7; --card: #fffdf8; --ink: #2b2a27; --muted: #6f6a60; --line: #e2d9c8; --chip: #efe7d6;
  --ok: #2e9e6b; --warn: #c97e00; --bad: #c8453b; --busy: #2f6fde;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1b18; --card: #282522; --ink: #f1ece2; --muted: #a59e90; --line: #3d3833; --chip: #35312c;
    --ok: #4cc38a; --warn: #f0b429; --bad: #f0736a; --busy: #7aa7ff;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--round);
}
.wrap { max-width: 1180px; margin: 0 auto; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.top .project { color: var(--muted); font-family: var(--mono); font-size: 13px; }
.link { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.link i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); animation: pulse 2s ease-in-out infinite; }
body[data-link="off"] .link i { background: var(--bad); animation: none; }
body[data-link="off"] .stage { opacity: .55; }
.lost { display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--chip); border: 1px solid var(--bad); }
body[data-link="off"] .lost { display: block; }

.item { margin: 0 0 30px; }
.item > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.item h2 { font-size: 20px; margin: 0; font-family: var(--mono); font-weight: 700; overflow-wrap: anywhere; }
.size { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.summary { color: var(--muted); margin: 0; flex: 1 1 240px; overflow-wrap: anywhere; }
.phases { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 12px 0 6px; }
.phases li { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.phases li[data-past] { color: var(--ink); }
.phases li[data-on] { background: var(--busy); color: #fff; font-weight: 700; animation: glow 2.4s ease-in-out infinite; }
.next { margin: 4px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
.next b { color: var(--ink); }
.desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.nodesk { color: var(--muted); font-style: italic; margin: 0; }

.card {
  position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 14px 14px 12px; min-width: 0; overflow: hidden; transition: border-color .4s, opacity .4s;
}
.card[data-mood="working"] { border-color: var(--busy); }
.card[data-mood="blocked"] { border-color: var(--warn); animation: nudge 2.2s ease-in-out infinite; }
.card[data-mood="done"] { border-color: var(--ok); }
.card[data-mood="missed"] { border-color: var(--bad); }
.card[data-mood="waiting"] { opacity: .72; }
.head { display: flex; gap: 10px; align-items: flex-start; }
.who { width: 92px; height: 92px; flex: none; color: var(--ink); }
.id { min-width: 0; flex: 1; }
.name { font-weight: 700; font-size: 16px; margin: 2px 0 0; overflow-wrap: anywhere; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 1px 0 6px; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--chip); }
.card[data-mood="working"] .badge { background: var(--busy); color: #fff; }
.card[data-mood="blocked"] .badge { background: var(--warn); color: #fff; }
.card[data-mood="done"] .badge { background: var(--ok); color: #fff; }
.card[data-mood="missed"] .badge { background: var(--bad); color: #fff; }
.bubble {
  position: relative; margin: 10px 0 8px; padding: 7px 11px; border-radius: 12px; background: var(--chip);
  font-size: 14px; overflow-wrap: anywhere; min-height: 34px;
}
.bubble::before {
  content: ""; position: absolute; top: -7px; left: 38px; border: 7px solid transparent; border-top: 0;
  border-bottom-color: var(--chip);
}
.bubble .dots::after { content: ""; animation: ellipsis 1.4s steps(4, end) infinite; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 8px; overflow-wrap: anywhere; }
.question { margin: 0 0 8px; padding: 8px 10px; border-left: 3px solid var(--warn); background: var(--chip); border-radius: 0 10px 10px 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
.bar { height: 7px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 2px 0 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .6s ease; }
.todo { list-style: none; margin: 0 0 8px; padding: 0; max-height: 9.2em; overflow: auto; font-size: 13px; }
.todo li { display: flex; gap: 7px; padding: 1px 0; overflow-wrap: anywhere; }
.todo li::before { content: "○"; color: var(--muted); flex: none; }
.todo li[data-done="true"] { color: var(--muted); text-decoration: line-through; }
.todo li[data-done="true"]::before { content: "✓"; color: var(--ok); text-decoration: none; }
.todo li[data-done="null"]::before { content: "·"; }
.todo li.fresh { animation: tick .9s ease; }
.ticker { list-style: none; margin: 0 0 8px; padding: 6px 8px; border-radius: 10px; background: var(--chip); font: 11.5px/1.5 var(--mono); }
.ticker li { display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.ticker li span:last-child { overflow: hidden; text-overflow: ellipsis; }
.ticker li:last-child { color: var(--ink); }
.ticker li { color: var(--muted); }
.ticker li.fresh { animation: slidein .35s ease; }
.foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.earlier { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 5px; }
.earlier span { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.earlier span::before { content: "↳ "; }

.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: 34px; left: 56px; width: 7px; height: 7px; border-radius: 2px; opacity: 0; }
.card.party .confetti i { animation: pop 1.1s ease-out forwards; }
.confetti i:nth-child(1) { background: #f4a261; --dx: -46px; --dy: -34px; }
.confetti i:nth-child(2) { background: #2a9d8f; --dx: 40px; --dy: -42px; }
.confetti i:nth-child(3) { background: #e76f8a; --dx: 72px; --dy: -8px; }
.confetti i:nth-child(4) { background: #5b8def; --dx: -30px; --dy: 30px; }
.confetti i:nth-child(5) { background: #ffd23f; --dx: 96px; --dy: 26px; }
.confetti i:nth-child(6) { background: #9b7ede; --dx: 16px; --dy: -54px; }

/* The character. Parts are shown and moved by the card's mood. */
.who .ink { fill: #2b2a27; }
.who .line { stroke: #2b2a27; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.who .shadow { fill: currentColor; opacity: .13; }
.who .body, .who .eyes, .who .armr, .who .prop, .who .armup { transform-box: fill-box; transform-origin: center bottom; }
.who .eyes { transform-origin: center; animation: blink 4.6s infinite; }
.who .body { animation: breathe 3.4s ease-in-out infinite; }
.who .fx, .who .mouth, .who .eyesx, .who .armup { display: none; }
.who .m-flat { display: block; }
[data-mood="working"] .who .body { animation: bob .62s ease-in-out infinite; }
[data-mood="working"] .who .prop { animation: wiggle .5s ease-in-out infinite; transform-origin: left bottom; }
[data-mood="working"] .who .m-flat { display: none; }
[data-mood="working"] .who .m-smile { display: block; }
[data-mood="thinking"] .who .fx-dots { display: block; }
[data-mood="thinking"] .who .fx-dots circle { animation: dot 1.2s ease-in-out infinite; }
[data-mood="thinking"] .who .fx-dots circle:nth-child(2) { animation-delay: .2s; }
[data-mood="thinking"] .who .fx-dots circle:nth-child(3) { animation-delay: .4s; }
[data-mood="thinking"] .who .body { animation: sway 3s ease-in-out infinite; }
[data-mood="quiet"] .who .fx-zzz { display: block; }
[data-mood="quiet"] .who .fx-zzz text { animation: float 2.6s ease-in-out infinite; }
[data-mood="quiet"] .who .fx-zzz text:nth-child(2) { animation-delay: .9s; }
[data-mood="quiet"] .who .eyes { animation: none; transform: scaleY(.14); }
[data-mood="blocked"] .who .fx-q { display: block; animation: hop .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
[data-mood="blocked"] .who .armr { display: none; }
[data-mood="blocked"] .who .armup { display: block; animation: wave .8s ease-in-out infinite; }
[data-mood="blocked"] .who .m-flat { display: none; }
[data-mood="blocked"] .who .m-o { display: block; }
[data-mood="done"] .who .fx-star { display: block; }
[data-mood="done"] .who .fx-star path { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
[data-mood="done"] .who .fx-star path:nth-child(2) { animation-delay: .6s; }
[data-mood="done"] .who .m-flat { display: none; }
[data-mood="done"] .who .m-grin { display: block; }
.card.party .who .body { animation: jump .55s ease-out 2; }
[data-mood="missed"] .who .fx-cloud { display: block; }
[data-mood="missed"] .who .fx-cloud .rain { animation: rain .7s linear infinite; }
[data-mood="missed"] .who .eyes { display: none; }
[data-mood="missed"] .who .eyesx { display: block; }
[data-mood="missed"] .who .m-flat { display: none; }
[data-mood="missed"] .who .m-sad { display: block; }
[data-mood="waiting"] .who { filter: grayscale(.85); }

@keyframes pulse { 50% { opacity: .35; } }
@keyframes glow { 50% { filter: brightness(1.18); } }
@keyframes nudge { 0%, 88%, 100% { transform: none; } 92% { transform: translateX(-2px); } 96% { transform: translateX(2px); } }
@keyframes ellipsis { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@keyframes tick { 0% { background: color-mix(in srgb, var(--ok) 35%, transparent); } 100% { background: transparent; } }
@keyframes slidein { from { opacity: 0; transform: translateY(6px); } }
@keyframes pop { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(200deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes breathe { 50% { transform: scaleY(1.025); } }
@keyframes bob { 50% { transform: translateY(-3.5px) scaleY(.985); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
@keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes float { 0% { opacity: 0; transform: translateY(5px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-7px); } }
@keyframes hop { 50% { transform: translateY(-5px); } }
@keyframes wave { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(.55); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }
@keyframes jump { 40% { transform: translateY(-13px); } }
@keyframes rain { from { transform: translateY(0); opacity: 1; } to { transform: translateY(8px); opacity: 0; } }

.empty { text-align: center; padding: 40px 0 20px; color: var(--muted); }
.empty .who { width: 120px; height: 120px; margin: 0 auto 6px; display: block; }
.closed { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
.closed summary { cursor: pointer; font-weight: 700; }
.closed ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 18px; font-size: 13px; }
.closed li { overflow-wrap: anywhere; color: var(--muted); }
.closed li b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
footer { margin-top: 26px; font-size: 12px; color: var(--muted); }
@media (max-width: 520px) {
  body { font-size: 14px; }
  .who { width: 76px; height: 76px; }
  .link { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-link="on">
<div class="wrap">
  <div class="top">
    <h1>Crew Board</h1>
    <span class="project" id="project"></span>
    <span class="link" role="status"><i></i><span id="linktext">live</span></span>
  </div>
  <p class="lost">The board script is not answering. Is <code>server.mjs</code> still running? The page shows the last state it got.</p>
  <main class="stage" id="stage"></main>
  <div class="empty" id="empty" hidden>
    <span id="emptywho"></span>
    <p>No open work items. The crew is off duty.</p>
  </div>
  <details class="closed" id="closed" hidden>
    <summary id="closedsum">Closed</summary>
    <ul id="closedlist"></ul>
  </details>
  <footer>Reads <code>.crew/work/</code> every 2 seconds. Nothing on this page changes the work.</footer>
</div>
<script>
(function () {
  'use strict';

  var PHASES = ['intake', 'plan', 'approval', 'implement', 'verify', 'review', 'ship', 'done'];
  var FRESH_MS = 20000;      // a call this recent means "working"
  var AWAKE_MS = 180000;     // a sign of life this recent means "thinking", older means "quiet"
  // The log records when a call starts, never when it ends. So after FRESH_MS without a new call the page
  // cannot tell a long-running command from thinking: that mood is labelled "Busy" and shows the last call.
  var MOOD_LABEL = { working: 'Working', thinking: 'Busy', quiet: 'Quiet', blocked: 'Blocked', done: 'Done', missed: 'Missed', waiting: 'Waiting' };

  // Role looks. The SVG below is built from these constants only; crew text never goes into markup.
  var ROLES = {
    researcher: { color: '#2a9d8f',
      prop: '<circle cx="104" cy="68" r="9" fill="rgba(255,255,255,.4)" class="line"/><path class="line" d="M98 75 L92 83" stroke-width="4"/>' },
    engineer: { color: '#f4a261',
      hat: '<path d="M37 45 Q60 16 83 45 Z" fill="#ffd23f"/><rect x="33" y="42" width="54" height="6" rx="3" fill="#f2b705"/>',
      prop: '<path d="M94 84 L104 60" stroke="#8a5a2b" stroke-width="4.5" stroke-linecap="round"/><rect x="95" y="52" width="19" height="10" rx="2.5" fill="#6b7280" transform="rotate(22 104 57)"/>' },
    'test-engineer': { color: '#9b7ede',
      face: '<rect x="40" y="56" width="40" height="15" rx="7.5" fill="rgba(255,255,255,.45)" class="line" stroke-width="2.5"/>',
      prop: '<path d="M98 56 h8 v9 l8 16 a3 3 0 0 1 -3 4 h-18 a3 3 0 0 1 -3 -4 l8 -16 z" fill="rgba(255,255,255,.55)" class="line" stroke-width="2.5"/><path d="M94 77 h16 l3 6 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 z" fill="#7bd88f"/>' },
    verifier: { color: '#6abf69',
      prop: '<rect x="93" y="58" width="21" height="27" rx="3" fill="#fff" class="line" stroke-width="2.5"/><rect x="99" y="55" width="9" height="6" rx="2" class="ink"/><path d="M97 72 l4.5 4.5 7.5 -9" stroke="#2e9e6b" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
    reviewer: { color: '#e76f8a',
      face: '<circle cx="49" cy="64" r="8.5" class="line" stroke-width="2.5"/><circle cx="71" cy="64" r="8.5" class="line" stroke-width="2.5"/><path d="M57.5 64 h5" class="line" stroke-width="2.5"/>',
      prop: '<path d="M96 83 L108 59" stroke="#c8453b" stroke-width="4.5" stroke-linecap="round"/><path d="M96 83 l-2 6 5 -3 z" class="ink"/>' },
    organizer: { color: '#5b8def',
      hat: '<path d="M38 46 Q60 20 82 46 Z" fill="#274690"/><path d="M78 44 q14 -1 18 6 q-12 2 -20 -1 z" fill="#274690"/>',
      prop: '<path d="M93 74 l17 -11 v26 l-17 -11 z" fill="#ffd23f" class="line" stroke-width="2.5"/>' }
  };
  var PLAIN = { color: '#b8b0a2' };

  function characterSvg(role) {
    var r = Object.prototype.hasOwnProperty.call(ROLES, role) ? ROLES[role] : PLAIN;
    return '<svg class="who" viewBox="0 0 120 120" aria-hidden="true" focusable="false">' +
      '<ellipse class="shadow" cx="60" cy="111" rx="27" ry="5"/>' +
      '<g class="fx fx-cloud"><path d="M34 22 a8 8 0 0 1 14 -5 a10 10 0 0 1 18 3 a7 7 0 0 1 -2 14 h-26 a6.5 6.5 0 0 1 -4 -12 z" fill="#9aa0a6"/>' +
        '<g class="rain"><path class="line" stroke="#5b8def" stroke-width="2.2" d="M42 38 v5 M52 38 v5 M62 38 v5"/></g></g>' +
      '<g class="fx fx-zzz" font-family="sans-serif" font-weight="700" fill="currentColor"><text x="84" y="30" font-size="15">z</text><text x="95" y="18" font-size="11">z</text></g>' +
      '<g class="fx fx-dots" fill="currentColor"><circle cx="80" cy="20" r="3.4"/><circle cx="91" cy="14" r="3.4"/><circle cx="102" cy="10" r="3.4"/></g>' +
      '<g class="fx fx-q"><circle cx="100" cy="20" r="12" fill="#f0b429"/><text x="100" y="26" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#2b2a27">?</text></g>' +
      '<g class="fx fx-star" fill="#ffd23f"><path d="M20 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/><path d="M100 18 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z"/></g>' +
      '<g class="body">' +
        '<ellipse cx="27" cy="80" rx="6.5" ry="9.5" fill="' + r.color + '"/>' +
        '<g class="armr"><ellipse cx="93" cy="80" rx="6.5" ry="9.5" fill="' + r.color + '"/><g class="prop">' + (r.prop || '') + '</g></g>' +
        '<g class="armup"><ellipse cx="99" cy="51" rx="6.5" ry="12" fill="' + r.color + '" transform="rotate(30 99 51)"/></g>' +
        '<path d="M60 30 C85 30 93 52 93 76 C93 98 81 106 60 106 C39 106 27 98 27 76 C27 52 35 30 60 30 Z" fill="' + r.color + '"/>' +
        (r.hat || '') +
        '<g class="eyes"><circle class="ink" cx="49" cy="64" r="4.3"/><circle class="ink" cx="71" cy="64" r="4.3"/></g>' +
        '<g class="eyesx"><path class="line" d="M45 60 l8 8 M53 60 l-8 8 M67 60 l8 8 M75 60 l-8 8"/></g>' +
        (r.face || '') +
        '<path class="mouth m-flat line" d="M53 81 H67"/>' +
        '<path class="mouth m-smile line" d="M51 79 Q60 87 69 79"/>' +
        '<ellipse class="mouth m-o ink" cx="60" cy="82" rx="4.2" ry="5.2"/>' +
        '<path class="mouth m-sad line" d="M51 85 Q60 77 69 85"/>' +
        '<path class="mouth m-grin ink" d="M49 77 Q60 93 71 77 Z"/>' +
      '</g></svg>';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // Every text from the server passes through here. Direction-control characters are dropped, so a file name
  // cannot make its neighbours read reversed on the page.
  var DIRECTION_MARKS = new RegExp('[' + String.fromCharCode(0x061c, 0x200e, 0x200f, 0x202a) + '-' + String.fromCharCode(0x202e, 0x2066) + '-' + String.fromCharCode(0x2069) + ']', 'g');
  function str(v) { return typeof v === 'string' ? v.replace(DIRECTION_MARKS, '') : ''; }

  var skew = 0;
  function nowMs() { return Date.now() - skew; }
  function parseAt(text) {
    var t = Date.parse(str(text));
    return isFinite(t) ? t : NaN;
  }
  function ago(ms) {
    if (!isFinite(ms)) return '';
    if (ms < 5000) return 'just now';
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + ' s ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' min ago';
    var h = Math.floor(m / 60);
    if (h < 48) return h + ' h ago';
    return Math.floor(h / 24) + ' d ago';
  }
  function clock(text) {
    var t = parseAt(text);
    if (!isFinite(t)) return '';
    var d = new Date(t);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function shortTarget(target) {
    var t = str(target);
    var cut = t.lastIndexOf('/');
    return cut >= 0 && cut < t.length - 1 ? t.slice(cut + 1) : t;
  }
  var SEARCHERS = { grep: 1, rg: 1, find: 1, ls: 1, fd: 1, ag: 1 };
  function actionText(call) {
    var tool = str(call.tool), target = str(call.target), name = shortTarget(target);
    if (tool === 'Read') return 'Reading ' + (name || 'a file');
    if (tool === 'Edit' || tool === 'NotebookEdit') return 'Editing ' + (name || 'a file');
    if (tool === 'Write') return 'Writing ' + (name || 'a file');
    if (tool === 'Bash') {
      if (!target) return 'Running a command';
      if (Object.prototype.hasOwnProperty.call(SEARCHERS, target)) return 'Searching with ' + target;
      return 'Running ' + target;
    }
    if (tool === 'Grep' || tool === 'Glob') return 'Searching for ' + (target || 'something');
    if (tool === 'WebFetch') return 'Fetching ' + (target || 'a page');
    return 'Using ' + (tool || 'a tool');
  }

  function lastCall(a) {
    var last = a.live && Array.isArray(a.live.last) ? a.live.last : [];
    return last.length ? last[last.length - 1] : null;
  }
  // Age of a time in milliseconds: never negative, and unknown (Infinity) for text that is no time or for a
  // time more than a minute ahead of the server's clock.
  function ageOf(text) {
    var t = parseAt(text);
    if (!isFinite(t)) return Infinity;
    var age = nowMs() - t;
    return age < -60000 ? Infinity : Math.max(0, age);
  }
  function moodOf(a) {
    var st = a.status ? str(a.status.state) : '';
    var bs = str(a.boardState).toLowerCase();
    if (st === 'blocked' || /^blocked/.test(bs)) return 'blocked';
    if (st === 'failed' || /^(missed|failed)/.test(bs)) return 'missed';
    if (st === 'done' || /^done/.test(bs)) return 'done';
    if (st === 'in-progress' || /^in-progress/.test(bs)) {
      var call = lastCall(a);
      var callAge = call ? ageOf(call.at) : Infinity;
      if (callAge < FRESH_MS) return 'working';
      if (!a.status && !a.live) return 'thinking';
      var updAge = a.status ? ageOf(a.status.updated) : Infinity;
      if (callAge < AWAKE_MS || updAge < AWAKE_MS) return 'thinking';
      return 'quiet';
    }
    return 'waiting';
  }
  function bubbleText(a, mood) {
    if (mood === 'working') return actionText(lastCall(a));
    if (mood === 'thinking') {
      var call = lastCall(a);
      return call ? actionText(call) + ' · started ' + ago(ageOf(call.at)) : 'On it';
    }
    if (mood === 'quiet') return 'Gone quiet';
    if (mood === 'blocked') return 'I have a question';
    if (mood === 'done') return 'Done!';
    if (mood === 'missed') return 'Missed the check';
    return 'Waiting to start';
  }

  // One card per task; it shows the newest attempt and lists the earlier ones.
  function makeCard() {
    var c = el('article', 'card');
    c.who = el('span');
    c.name = el('p', 'name');
    c.meta = el('p', 'meta');
    c.badge = el('span', 'badge');
    var id = el('div', 'id'); id.append(c.name, c.meta, c.badge);
    var head = el('div', 'head'); head.append(c.who, id);
    c.bubble = el('p', 'bubble');
    c.note = el('p', 'note');
    c.question = el('p', 'question');
    c.bar = el('div', 'bar'); c.fill = el('i'); c.bar.append(c.fill);
    c.todo = el('ul', 'todo');
    c.ticker = el('ul', 'ticker');
    c.calls = el('span'); c.age = el('span');
    var foot = el('div', 'foot'); foot.append(c.calls, c.age);
    c.earlier = el('div', 'earlier');
    var confetti = el('div', 'confetti');
    for (var i = 0; i < 6; i++) confetti.append(el('i'));
    c.append(confetti, head, c.bubble, c.note, c.question, c.bar, c.todo, c.ticker, foot, c.earlier);
    c.addEventListener('animationend', function (ev) { if (ev.animationName === 'pop') c.classList.remove('party'); });
    return c;
  }

  function updateCard(c, task) {
    var attempts = Array.isArray(task.attempts) ? task.attempts : [];
    var a = attempts[attempts.length - 1] || {};
    var role = str(a.role);
    if (c.role !== role) { c.who.innerHTML = characterSvg(role); c.role = role; }

    var mood = moodOf(a);
    if (c.dataset.mood && c.dataset.mood !== 'done' && mood === 'done') c.classList.add('party');
    c.dataset.mood = mood;
    c.name.textContent = (str(a.id) || str(task.task)) + (role ? ' · ' + role : '');
    c.meta.textContent = [str(a.model), str(a.effort)].filter(function (x) { return x && x !== '-'; }).join(' · ');
    c.badge.textContent = MOOD_LABEL[mood];
    c.badge.title = str(a.boardState);

    var text = bubbleText(a, mood);
    var call = lastCall(a);
    if (c.bubbleText !== text + mood) {
      c.bubble.textContent = text;
      if (mood === 'thinking' && !call) c.bubble.append(el('span', 'dots'));
      c.bubbleText = text + mood;
    }
    c.bubble.title = call && (mood === 'working' || mood === 'thinking') ? str(call.target) : '';

    var st = a.status || null;
    var board = str(a.boardState);
    // The board cell is worth showing only when it says more than a bare state word.
    var showNote = /\s/.test(board.trim());
    c.note.textContent = showNote ? board : '';
    c.note.hidden = !showNote;

    var q = st ? str(st.questions) : '';
    c.question.textContent = q;
    c.question.hidden = !(q && mood === 'blocked');

    var progress = st && Array.isArray(st.progress) ? st.progress : [];
    var boxes = progress.filter(function (p) { return p && p.done !== null && p.done !== undefined; });
    var doneCount = boxes.filter(function (p) { return p.done === true; }).length;
    c.bar.hidden = boxes.length === 0;
    c.fill.style.width = boxes.length ? Math.round(100 * doneCount / boxes.length) + '%' : '0';
    var sig = JSON.stringify(progress);
    if (c.todoSig !== sig) {
      var before = c.todoDone || Object.create(null);
      var after = Object.create(null);
      c.todo.replaceChildren.apply(c.todo, progress.map(function (p) {
        var li = el('li', '', str(p && p.text));
        var done = p ? p.done : null;
        li.dataset.done = done === true ? 'true' : done === false ? 'false' : 'null';
        var key = str(p && p.text);
        after[key] = done === true;
        if (c.todoSig !== undefined && done === true && !before[key]) li.className = 'fresh';
        return li;
      }));
      c.todoDone = after;
      c.todoSig = sig;
    }
    c.todo.hidden = progress.length === 0;

    var last = a.live && Array.isArray(a.live.last) ? a.live.last.slice(-4) : [];
    var tsig = JSON.stringify(last);
    if (c.tickSig !== tsig) {
      var seen = c.tickSeen || Object.create(null);
      var now = Object.create(null);
      c.ticker.replaceChildren.apply(c.ticker, last.map(function (call) {
        var li = el('li');
        var key = str(call.at) + str(call.tool) + str(call.target);
        now[key] = 1;
        if (c.tickSig !== undefined && !seen[key]) li.className = 'fresh';
        li.append(el('span', '', clock(call.at)), el('span', '', str(call.tool)), el('span', '', str(call.target)));
        li.title = str(call.target);
        return li;
      }));
      c.tickSeen = now;
      c.tickSig = tsig;
    }
    c.ticker.hidden = last.length === 0;

    var calls = a.live && typeof a.live.calls === 'number' ? a.live.calls : null;
    c.calls.textContent = calls === null ? '' : calls + (calls === 1 ? ' tool call' : ' tool calls');
    c.age.dataset.at = st ? str(st.updated) : '';
    setAge(c.age);

    var older = attempts.slice(0, -1);
    c.earlier.replaceChildren.apply(c.earlier, older.map(function (o) {
      var what = [str(o.model), str(o.effort)].filter(Boolean).join(', ');
      return el('span', '', str(o.id) + (what ? ' (' + what + ')' : '') + ': ' + (str(o.boardState) || 'earlier attempt'));
    }));
    c.earlier.hidden = older.length === 0;
  }

  function setAge(node) {
    var raw = node.dataset.at || '';
    node.title = '';
    if (!raw) { node.textContent = ''; return; }
    var t = parseAt(raw);
    // A date without a time, or text that is no date, is shown as written.
    if (!isFinite(t) || raw.indexOf('T') < 0) { node.textContent = 'updated ' + raw; return; }
    node.textContent = 'updated ' + ago(Math.max(0, nowMs() - t));
    node.title = raw;
  }

  function makeItem() {
    var s = el('section', 'item');
    s.h = el('h2'); s.size = el('span', 'size'); s.summary = el('p', 'summary');
    var header = el('header'); header.append(s.h, s.size, s.summary);
    s.phases = el('ol', 'phases');
    PHASES.forEach(function (p) { s.phases.append(el('li', '', p)); });
    s.other = el('li'); s.other.hidden = true; s.phases.append(s.other);
    s.next = el('p', 'next');
    s.desks = el('div', 'desks');
    s.nodesk = el('p', 'nodesk', 'No one is at a desk yet.');
    s.append(header, s.phases, s.next, s.desks, s.nodesk);
    s.cards = new Map();
    return s;
  }

  function updateItem(s, o) {
    s.h.textContent = str(o.id);
    s.size.textContent = str(o.size); s.size.hidden = !str(o.size);
    s.summary.textContent = str(o.summary);
    var phase = str(o.phase).toLowerCase();
    var at = PHASES.indexOf(phase);
    for (var i = 0; i < PHASES.length; i++) {
      var li = s.phases.children[i];
      if (i === at) li.setAttribute('data-on', ''); else li.removeAttribute('data-on');
      if (at >= 0 && i < at) li.setAttribute('data-past', ''); else li.removeAttribute('data-past');
    }
    s.other.hidden = at >= 0 || !phase;
    if (!s.other.hidden) { s.other.textContent = str(o.phase); s.other.setAttribute('data-on', ''); }
    s.next.replaceChildren();
    if (str(o.next)) { s.next.append(el('b', '', 'Next: '), document.createTextNode(str(o.next))); }
    s.next.hidden = !str(o.next);

    var tasks = Array.isArray(o.tasks) ? o.tasks : [];
    var keep = Object.create(null);
    tasks.forEach(function (task, i) {
      var key = str(task.task) || 'row' + i;
      if (keep[key]) key = key + ' #' + i;   // the same task id twice: each row keeps a card of its own
      keep[key] = 1;
      var c = s.cards.get(key);
      if (!c) { c = makeCard(); s.cards.set(key, c); }
      if (s.desks.children[i] !== c) s.desks.insertBefore(c, s.desks.children[i] || null);
      updateCard(c, task);
    });
    s.cards.forEach(function (c, key) { if (!keep[key]) { c.remove(); s.cards.delete(key); } });
    s.nodesk.hidden = tasks.length > 0;
  }

  var stage = document.getElementById('stage');
  var items = new Map();
  function render(state) {
    document.getElementById('project').textContent = str(state.project);
    var open = Array.isArray(state.open) ? state.open : [];
    var keep = Object.create(null);
    open.forEach(function (o, i) {
      var id = str(o.id) || 'item' + i;
      if (keep[id]) id = id + ' #' + i;   // the same id twice under Open: each line keeps a section of its own
      keep[id] = 1;
      var s = items.get(id);
      if (!s) { s = makeItem(); items.set(id, s); }
      if (stage.children[i] !== s) stage.insertBefore(s, stage.children[i] || null);
      updateItem(s, o);
    });
    items.forEach(function (s, id) { if (!keep[id]) { s.remove(); items.delete(id); } });
    document.getElementById('empty').hidden = open.length > 0;

    var closed = Array.isArray(state.closed) ? state.closed : [];
    var box = document.getElementById('closed');
    box.hidden = closed.length === 0;
    document.getElementById('closedsum').textContent = 'Closed (' + closed.length + ')';
    var csig = JSON.stringify(closed);
    if (box.sig !== csig) {
      var list = document.getElementById('closedlist');
      list.replaceChildren.apply(list, closed.map(function (c) {
        var li = el('li');
        li.append(el('b', '', str(c.id)), document.createTextNode(' ' + [str(c.size) && '(' + str(c.size) + ')', str(c.note)].filter(Boolean).join(' ')));
        return li;
      }));
      box.sig = csig;
    }
  }

  // One request at a time: the next one is planned only when this one has ended, and a request that gets no
  // answer is given up after 5 seconds. A server that hangs then costs one open request, not one every poll.
  var failures = 0;
  function poll() {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var giveUp = ctl ? setTimeout(function () { ctl.abort(); }, 5000) : 0;
    fetch('/api/state', { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) {
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    }).then(function (state) {
      var serverNow = parseAt(state.now);
      skew = isFinite(serverNow) ? Date.now() - serverNow : 0;
      failures = 0;
      document.body.dataset.link = 'on';
      document.getElementById('linktext').textContent = 'live';
      render(state);
    }).catch(function () {
      failures++;
      if (failures >= 2) {
        document.body.dataset.link = 'off';
        document.getElementById('linktext').textContent = 'no answer';
      }
    }).then(function () {
      clearTimeout(giveUp);
      setTimeout(poll, 2000);
    });
  }

  // "/?gallery" shows every character in every mood, built here, without asking the server.
  function galleryState() {
    var now = new Date(), iso = now.toISOString(), old = new Date(now - 600000).toISOString();
    var call = { at: iso, tool: 'Edit', target: 'src/db/orders.js' };
    var todo = [{ done: true, text: 'First step' }, { done: false, text: 'Second step' }];
    var looks = {
      working: { boardState: 'in-progress', status: { state: 'in-progress', updated: iso, progress: todo, questions: '' }, live: { calls: 12, last: [call] } },
      thinking: { boardState: 'in-progress', status: { state: 'in-progress', updated: iso, progress: todo, questions: '' }, live: null },
      quiet: { boardState: 'in-progress', status: { state: 'in-progress', updated: old, progress: todo, questions: '' }, live: null },
      blocked: { boardState: 'in-progress', status: { state: 'blocked', updated: iso, progress: todo, questions: 'Keep the old names or use the new ones? Proposed: keep the old ones.' }, live: null },
      done: { boardState: 'done', status: { state: 'done', updated: iso, progress: [{ done: true, text: 'First step' }, { done: true, text: 'Second step' }], questions: '' }, live: null },
      missed: { boardState: 'missed: sent back, still failing', status: { state: 'failed', updated: iso, progress: todo, questions: '' }, live: null },
      waiting: { boardState: 'todo', status: null, live: null }
    };
    var tasks = [];
    Object.keys(ROLES).forEach(function (role) {
      Object.keys(looks).forEach(function (mood) {
        var a = { id: MOOD_LABEL[mood].toLowerCase(), role: role, model: 'sonnet', effort: 'medium' };
        Object.keys(looks[mood]).forEach(function (k) { a[k] = looks[mood][k]; });
        tasks.push({ task: role + '-' + mood, attempts: [a] });
      });
    });
    return { project: 'gallery', now: iso, closed: [],
      open: [{ id: 'gallery', size: '', summary: 'every character in every mood', phase: 'implement', updated: iso, next: '', tasks: tasks }] };
  }

  document.getElementById('emptywho').innerHTML = characterSvg('organizer');
  document.getElementById('empty').dataset.mood = 'quiet';
  if (/[?&]gallery\b/.test(location.search)) {
    document.getElementById('linktext').textContent = 'gallery';
    render(galleryState());
    return;
  }
  poll();
  setInterval(function () {
    var nodes = document.querySelectorAll('.foot [data-at]');
    for (var i = 0; i < nodes.length; i++) setAge(nodes[i]);
  }, 1000);
})();
</script>
</body>
</html>
